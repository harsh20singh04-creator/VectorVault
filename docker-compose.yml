services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama

  vectorvault:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8080:8080"
    environment:
      VECTORVAULT_HOST: 0.0.0.0
      PORT: 8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_GEN_MODEL: ${OLLAMA_GEN_MODEL:-llama3.2}
      VECTORVAULT_API_KEY: ${VECTORVAULT_API_KEY:?Set VECTORVAULT_API_KEY before starting VectorVault}
    volumes:
      - vectorvault_data:/app/data

volumes:
  ollama_data:
  vectorvault_data:
